# Host toolchain for crates, services and LiteSVM tests. On-chain code is compiled by the
# platform-tools rustc that ships with solana-cli 4.2.1 (`anchor build`), not by this one.
# 1.97+ is required by the Agave 4.2 runtime crates LiteSVM 0.16 links (docs/toolchain.md).
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
