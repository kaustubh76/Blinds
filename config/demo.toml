# THE WINDOW for Stocks — DEMO profile (spec §7.5, units per docs/SPEC_AMENDMENTS.md §7).
# Single source of truth: read by crates/window-config (services, scripts, tests) and used to
# build the on-chain Config initialisation. Slots are ~400 ms.
[market]
epoch_slots = 300            # ~2 min
tenor_slots = 150            # overnight-style loan life
keeper_grace_slots = 150     # anyone may close after start + epoch_slots + grace
stale_after_slots = 450      # print deadline after close
max_price_age_slots = 75     # ~30 s
band_edge_epochs = 5         # consecutive edge prints that raise the BandEdge flag
max_bids_per_epoch = 4096
bid_min_micro_usdc = 1_000_000   # s_min = 1 USDC; range proof is on (size - s_min) in [0, 2^40)

[credit]
haircut_bps = 15000          # collateral value must cover 150% of the loan
collateral_bits = 32         # c in milli-shares < 2^32 (4.29M shares)
price_exp = 2                # p' = price in 10^-2 USDC (cents) per share
mult_exp = 3                 # a = corporate-action multiplier * 10^3

[print]
attest_batch = 4             # PoCD proofs per attest_ticks tx; measured 1,170 B of 1,232 (3 → 975 B)
bsgs_baby_bits = 20          # 1M-entry baby table; giant steps from 0 so realistic sums decode instantly
bsgs_max_bits = 44           # sum <= n_t * 2^40 with n_t <= 16 per tick in practice

# The collateral schedule. All-zero feed ids = "this profile runs on a local validator, where there
# is no Pyth": the keeper posts the documented mock walk under the all-zero id, so nothing on-chain
# ever claims a source it did not read (amendment A11). Two listings so tier 2 exercises a second
# collateral with its own haircut and price cache.
[[listings]]
key = "mock_tsla"
symbol = "TSLAx-mock"
decimals = 3                 # milli-shares
source = "mock"
haircut_bps = 15000
max_publish_age_secs = 3600
initial_multiplier = 1.0

[[listings]]
key = "mock_preipo"
symbol = "PREIPO-mock"
decimals = 3
source = "mock"
haircut_bps = 20000          # pre-IPO marks carry a bigger haircut
max_publish_age_secs = 172800
initial_multiplier = 1.0
