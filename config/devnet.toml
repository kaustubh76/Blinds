# THE WINDOW for Stocks — DEVNET profile: the deployment judges verify (spec §7.5, units per
# docs/SPEC_AMENDMENTS.md §7). Read by crates/window-config and written into the on-chain `Config`
# accounts at `initialize`. Neither program has a config-update instruction, so these values are
# fixed for the life of the deployment — burn is controlled by starting/stopping the admin, not by
# changing them.
#
# COST (devnet rent measured 2026-09-16 at 5,080.9 lamports/byte, `solana rent -ud`):
#   Epoch 5,104 B = 0.02658 SOL and Print 680 B = 0.004105 SOL are never closed;
#   each Loan 446 B = 0.002917 SOL (414 B before the listing upgrade); each Bid 155 B = 0.001438 SOL comes back via `close_bid`.
#   With ~2 loans per print that is ~0.0362 SOL per epoch = ~0.33 SOL/hour at the cadence below.
#   Transaction fees (~35/epoch at 5,000 lamports) are ~0.5% of that.
[market]
epoch_slots = 900            # ~6-8 min: devnet slots run 0.44-0.55 s
tenor_slots = 2700           # a loan lives ~3 epochs, so repay/seize both land inside a demo
keeper_grace_slots = 450     # anyone may close after start + epoch_slots + grace
stale_after_slots = 2700     # print deadline after close; also gates permissionless close_bid
max_price_age_slots = 1200   # ~9 min; the keeper reposts at half this
band_edge_epochs = 5
max_bids_per_epoch = 4096
bid_min_micro_usdc = 1_000_000   # s_min = 1 USDC; range proof is on (size - s_min) in [0, 2^40)

[credit]
haircut_bps = 15000          # collateral value must cover 150% of the loan
collateral_bits = 32         # c in milli-shares < 2^32 (4.29M shares)
price_exp = 2                # p' = price in 10^-2 USDC (cents) per share
mult_exp = 3                 # a = corporate-action multiplier * 10^3

[print]
attest_batch = 4             # PoCD proofs per attest_ticks tx; measured 1,182 B of 1,232
bsgs_baby_bits = 20          # 1M-entry baby table; giant steps from 0
bsgs_max_bits = 44           # sum <= n_t * 2^40 with n_t <= 16 per tick in practice

# The collateral schedule: one xONIA rate, several eligible collaterals. Each [[listings]] entry
# becomes a `Listing` PDA in window_credit with its own PriceCache, haircut and freshness limits
# (docs/TRACKS.md). The `-mock` mints are devnet twins; no mainnet token is touched.

# Pyth Crypto.TSLAX/USD — a 24/7 feed. With `PYTH_API_KEY` set the keeper reads Hermes
# (`PYTH_HERMES_URL`, default https://pyth.dourolabs.app/hermes); otherwise, and whenever Hermes
# fails, it reads Pyth's own on-chain `PriceUpdateV2` accounts — `price_account` below plus the
# push-oracle PDAs for shards 0 and 1 — over the mainnet RPC (Pyth publishes these on mainnet only;
# the desk itself runs on devnet), and copies price/expo/publish_time into `PriceCache` unmodified,
# so the quote's own age is public. Recorded honestly: `price_account` (shard 0) stopped being
# updated on 2026-09-12, which is why the keeper no longer trusts a single account
# (docs/METHODOLOGY.md §5a). This is listing #0 — the collateral `Config` was initialised with.
[[listings]]
key = "mock_tsla"
symbol = "TSLAx-mock"
decimals = 3                 # milli-shares
source = "pyth"
haircut_bps = 15000          # matches [credit].haircut_bps, the frozen Config value
max_publish_age_secs = 3600  # a 24/7 feed: an hour-old quote is a broken feed, not a closed market
initial_multiplier = 1.0
pyth_feed_id = "0x47a156470288850a440df3a6ce85a55917b813a19bb5b31128a33a986566a362"
price_account = "GpoWLTd6GoisYxYgHz7mTcZvgnfJu4SN7T6PxWjgUTFY"
price_rpc_url = "https://api.mainnet-beta.solana.com"
# Stage 4: the desk's poster (`services/pyth-poster`, needs `PYTH_API_KEY`) writes this feed's
# signed update into the Pyth receiver on *devnet*, push-oracle shard 7001. Once that account is
# fresh, `window-admin listing-set-source mock_tsla 4` flips the listing and `lock_collateral` /
# `seize` read Pyth's receiver-owned account directly — no keeper copy in the path.
pyth_shard = 7001

# PreStocks ANTHROPIC (pre-IPO). Same mechanism with PreStocks' public API; label
# sha256("prestocks:ANTHROPIC"). Mainnet mint Pren1…, never touched by the desk.
[[listings]]
key = "prestocks_anthropic"
symbol = "ANTHROPIC-mock"
decimals = 3
source = "prestocks"
haircut_bps = 20000
max_publish_age_secs = 172800
initial_multiplier = 1.0
source_url = "https://prestocks.com/api/prestocks"
source_mint = "Pren1FvFX6J3E4kXhJuCiAD5aDmGEb7qJRncwA8Lkhw"
source_symbol = "ANTHROPIC"
price_field = "markPrice"
