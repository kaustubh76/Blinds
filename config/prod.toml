# THE WINDOW for Stocks — PRODUCTION profile (parameters only; not deployed for the hackathon) (spec §7.5, units per docs/SPEC_AMENDMENTS.md §7).
# Single source of truth: read by crates/window-config (services, scripts, tests) and used to
# build the on-chain Config initialisation. Slots are ~400 ms.
[market]
epoch_slots = 9000           # ~1 h
tenor_slots = 54000          # ~6 h, inside the 24/5 trading week
keeper_grace_slots = 4500
stale_after_slots = 13500
max_price_age_slots = 300
band_edge_epochs = 24
max_bids_per_epoch = 4096
bid_min_micro_usdc = 1_000_000   # s_min = 1 USDC; range proof is on (size - s_min) in [0, 2^40)

[credit]
haircut_bps = 15000          # collateral value must cover 150% of the loan
collateral_bits = 32         # c in milli-shares < 2^32 (4.29M shares)
price_exp = 2                # p' = price in 10^-2 USDC (cents) per share
mult_exp = 3                 # a = corporate-action multiplier * 10^3

[print]
attest_batch = 4             # PoCD proofs per attest_ticks tx; measured 1,170 B of 1,232 (3 → 975 B)
bsgs_baby_bits = 20          # 1M-entry baby table; giant steps from 0 so realistic sums decode instantly
bsgs_max_bits = 48

# The collateral schedule: one xONIA rate, several eligible collaterals. Each [[listings]] entry
# becomes a `Listing` PDA in window_credit with its own PriceCache, haircut and freshness limits
# (docs/TRACKS.md). The `-mock` mints are devnet twins; no mainnet token is touched.

# Pyth Crypto.TSLAX/USD — a 24/7 feed. With `PYTH_API_KEY` set the keeper reads Hermes
# (`PYTH_HERMES_URL`, default https://pyth.dourolabs.app/hermes); otherwise, and whenever Hermes
# fails, it reads Pyth's own on-chain `PriceUpdateV2` accounts — `price_account` below plus the
# push-oracle PDAs for shards 0 and 1 — over the mainnet RPC (Pyth publishes these on mainnet only;
# the desk itself runs on devnet), and copies price/expo/publish_time into `PriceCache` unmodified,
# so the quote's own age is public. Recorded honestly: `price_account` (shard 0) stopped being
# updated on 2026-09-12, which is why the keeper no longer trusts a single account
# (docs/METHODOLOGY.md §5a). This is listing #0 — the collateral `Config` is initialised with.
[[listings]]
key = "mock_tsla"
symbol = "TSLAx-mock"
decimals = 3                 # milli-shares
source = "pyth"
haircut_bps = 15000          # matches [credit].haircut_bps, the frozen Config value
max_publish_age_secs = 3600  # a 24/7 feed: an hour-old quote is a broken feed, not a closed market
initial_multiplier = 1.0
pyth_feed_id = "0x47a156470288850a440df3a6ce85a55917b813a19bb5b31128a33a986566a362"
price_account = "GpoWLTd6GoisYxYgHz7mTcZvgnfJu4SN7T6PxWjgUTFY"
price_rpc_url = "https://api.mainnet-beta.solana.com"

# PreStocks ANTHROPIC (pre-IPO). Same mechanism with PreStocks' public API; label
# sha256("prestocks:ANTHROPIC"). Mainnet mint Pren1…, never touched by the desk.
[[listings]]
key = "prestocks_anthropic"
symbol = "ANTHROPIC-mock"
decimals = 3
source = "prestocks"
haircut_bps = 20000
max_publish_age_secs = 172800
initial_multiplier = 1.0
source_url = "https://prestocks.com/api/prestocks"
source_mint = "Pren1FvFX6J3E4kXhJuCiAD5aDmGEb7qJRncwA8Lkhw"
source_symbol = "ANTHROPIC"
price_field = "markPrice"
implied_field = "tokenPrice"   # the traded price beside the mark: served by the admin's /marks as the basis, never posted on chain
mark_valuation_field = "markValuation"       # the company's valuation at the mark, whole USD — /marks only
implied_valuation_field = "impliedValuation" # and at the price the token trades at
supply_field = "supply"                      # tokens outstanding, as PreStocks publishes it

# xStocks TSLAx, marked at what it actually trades for. Jupiter's public /price/v3 aggregates the
# real mainnet mint's own pools, so this is the price a desk would liquidate into — an attested
# mark, stamped at fetch, never a signed feed; label sha256("jupiter:TSLAx") =
# 3f2097ca…27d6, so it can never be mistaken for the Pyth feed above. `stockData.price` is the
# underlying stock beside it, which makes the basis on /marks the gap between the tokenized stock
# and the stock. The mint XsDoVfqe… is mainnet's and is never touched; the wrap is a devnet twin.
[[listings]]
key = "xstocks_tslax"
symbol = "TSLAx-xs"
decimals = 3                 # milli-shares, as listing #0
source = "mark"
source_name = "jupiter"
source_shape = "keyed"       # the response is one object keyed by the mint, not an array to search
haircut_bps = 15000          # a listed stock at a traded price: the same 150% as the Pyth TSLAx
max_publish_age_secs = 3600  # a 24/7 venue: an hour-old quote is a broken feed, not a closed market
initial_multiplier = 1.0
source_url = "https://lite-api.jup.ag/price/v3?ids=XsDoVfqeBukxuZHWhdvWHBhgEHjGNst4MLodqsJHzoB"
source_mint = "XsDoVfqeBukxuZHWhdvWHBhgEHjGNst4MLodqsJHzoB"
source_symbol = "TSLAx"
price_field = "usdPrice"
implied_field = "stockData.price"      # the underlying equity beside the token — /marks only, never on chain
mark_valuation_field = "stockData.mcap"  # the company's market cap, whole USD — /marks only
