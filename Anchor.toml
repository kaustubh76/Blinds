# THE WINDOW for Stocks — Anchor workspace.
#
# Tests run on two substrates (docs/BUILD_PLAN.md, "Tests — two tiers"):
#   tier 1: `cargo test` on LiteSVM (Agave's real program runtime in-process, exact slot control);
#   tier 2: `make test-integration` against a real `solana-test-validator` through the TS SDK.
# `anchor test` therefore does not start a validator; the Makefile does when it is needed.
skip_local_validator = true

[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

