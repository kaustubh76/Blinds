[workspace]
# Members are listed explicitly (not globbed) so a half-created crate can never break the build.
members = [
    "programs/window_registry",
    "programs/window_auction",
    "programs/window_oracle",
    "programs/window_wrap",
    "programs/window_credit",
    "crates/window-config",
    "crates/window-clearing",
    "crates/window-elgamal",
    "crates/window-proofs",
    "crates/window-client",
    "crates/window-proofs-wasm",
    "crates/window-testkit",
    "tests",
    "services/admin",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/kaushtubh/the-window-stocks"

[workspace.dependencies]
# --- On-chain framework. Pinned EXACTLY to the installed anchor-cli; verified with `anchor build`
# and executed on SBF inside LiteSVM (docs/toolchain.md). Bumping requires re-running the gate test.
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2" }

# --- Confidential-transfer primitives — the line the DEPLOYED verifier expects.
# solana-zk-sdk 5.0 changed the proof transcripts (global domain separator, context hashed in);
# Agave >= 4.2 verifies with that transcript. Proofs built with zk-sdk 4.x are rejected on devnet
# and mainnet (verified 2026-09-16 against a local Agave 4.2.1 validator). zk-sdk 7.0.1 carries the
# same transcript as 5.0.1 and, with solana-zk-elgamal-proof-interface 0.1.x, stays on
# solana-instruction 3 (Anchor 1.x). zk-sdk 8 / interface 1.0 move to solana-instruction 4: not yet.
solana-zk-sdk = { version = "=7.0.1" }
solana-zk-elgamal-proof-interface = "=0.1.3"
solana-zk-sdk-pod = "=0.1.2"
# `agave-unstable-api`: the curve25519 *crate* API is declared unstable by Agave (the syscalls
# underneath are activated protocol features and stable). Acknowledged explicitly; re-check on bump.
solana-curve25519 = { version = "=4.0.1" }
spl-token-2022-interface = { version = "=3.1.1", default-features = false }
spl-token-confidential-transfer-proof-extraction = "=0.6.1"
spl-token-confidential-transfer-proof-generation = "=0.6.1"
solana-instructions-sysvar = "3"
solana-pubkey = "3"
solana-instruction = "3"
solana-sdk-ids = "3"

# --- Pure-math / host side.
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }
# bytemuck must be a DIRECT dependency of any crate using #[zero_copy]: the macro emits
# `::bytemuck::Pod` resolved in the local crate. `derive` refuses to compile a struct with implicit
# padding, which is the safety net for the fixed-layout Epoch/Print accounts.
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }
thiserror = "2"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# --- Test substrate (host only). litesvm 0.16 = the Agave 4.2 runtime (devnet's), whose ZK ElGamal
# program verifies the zk-sdk >= 5 transcript. Needs Rust >= 1.97 (see docs/toolchain.md).
litesvm = "=0.16.0"
litesvm-token = "=0.16.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "3"
solana-message = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-clock = "3"
bincode = "1"
proptest = "1"

# --- Workspace crates.
window-elgamal = { path = "crates/window-elgamal", default-features = false }
window-clearing = { path = "crates/window-clearing", default-features = false }
window-proofs = { path = "crates/window-proofs", default-features = false }
window-config = { path = "crates/window-config" }
window-testkit = { path = "crates/window-testkit" }
window-client = { path = "crates/window-client" }

[profile.dev]
# No debuginfo for host builds: the LiteSVM/Agave dependency tree otherwise produces ~8 GB of
# artefacts. Backtraces stay readable via line tables.
debug = "line-tables-only"

[profile.release]
# overflow-checks stays ON in release. These programs account other people's collateral and loans;
# a silent wrap in a bound check is exactly the bug class that cannot be fixed after the freeze.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
