name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: 4.2.1
  ANCHOR_VERSION: 1.1.2

jobs:
  rust-fast:
    name: fmt + clippy + host tests (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.90.0", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude window-tests --exclude window-admin

  programs:
    name: anchor build + LiteSVM suites (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.90.0" }
      - uses: Swatinem/rust-cache@v2
      - name: install solana + anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install ${ANCHOR_VERSION} && avm use ${ANCHOR_VERSION}
      - run: anchor build
      - run: ./scripts/sync_idl.sh --check
      - run: cargo test --workspace
      - run: cargo test -p window-tests --test measurements -- --nocapture

  ts:
    name: typecheck + lint + unit tests (sdk, services, app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @thewindow/app build

  integration:
    name: real validator (tier 2)
    runs-on: ubuntu-latest
    needs: [programs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.90.0" }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: install solana + anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install ${ANCHOR_VERSION} && avm use ${ANCHOR_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: anchor build
      - run: make test-integration

  docs:
    name: honest claims + lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_claims.sh
      - run: ./scripts/check_lineage.sh
