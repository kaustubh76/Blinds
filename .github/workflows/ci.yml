name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: 4.2.1
  ANCHOR_VERSION: 1.1.2

jobs:
  rust-fast:
    name: fmt + clippy + host tests (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude window-tests --exclude window-admin

  programs:
    name: anchor build + LiteSVM suites (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1" }
      - uses: Swatinem/rust-cache@v2
      - name: install solana + anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install ${ANCHOR_VERSION} && avm use ${ANCHOR_VERSION}
      - run: anchor build
      - run: ./scripts/sync_idl.sh --check
      - name: deployed Token-2022 + ATA (LiteSVM's bundled Token-2022 lacks zk-ops)
        run: ./scripts/fetch_external_programs.sh
      - name: program size budget (devnet rent is paid once, forever)
        run: make size
      - name: overflow-checks must stay on in release
        run: grep -q '^overflow-checks = true' Cargo.toml
      - run: cargo test --workspace
      - run: cargo test -p window-tests --test measurements -- --nocapture

  ts:
    name: typecheck + lint + unit tests (sdk, services, app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1", targets: "wasm32-unknown-unknown" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build_wasm.sh
      - run: pnpm --filter @thewindow/solana-sdk build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @thewindow/app build
      - run: node scripts/measurements_to_md.mjs --check

  integration:
    name: real validator (tier 2)
    runs-on: ubuntu-latest
    needs: [programs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1" }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: install solana + anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install ${ANCHOR_VERSION} && avm use ${ANCHOR_VERSION}
      - run: cargo install wasm-pack --locked
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build_wasm.sh && pnpm --filter @thewindow/solana-sdk build
      - run: anchor build
      - run: cargo build -p window-admin --release
      # The admin service and the localnet scripts sign with the default CLI keypair.
      - run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
      - run: make test-integration

  docs:
    name: honest claims + lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_claims.sh
      - run: ./scripts/check_lineage.sh
