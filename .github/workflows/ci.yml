name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # avm's provenance check calls GitHub's attestation API; unauthenticated it is rate-limited (403).
  GITHUB_TOKEN: ${{ github.token }}
  SOLANA_VERSION: 4.2.1
  ANCHOR_VERSION: 1.1.2

jobs:
  rust-fast:
    name: fmt + clippy + host tests (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude window-tests --exclude window-admin
      # The proofs the release-built service sends must verify with the SDK's own verifier on this platform.
      - run: cargo test -p window-client --release -- proof_self_check

  programs:
    name: anchor build + LiteSVM suites (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1" }
      - uses: Swatinem/rust-cache@v2
      - name: install solana + anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          # avm verifies the prebuilt binary's build provenance against GitHub's attestation API, which
          # answered 403 on 23 Sep (unauthenticated rate limit) and failed the whole job. GITHUB_TOKEN
          # (set at the top of this file) authenticates that call; a source build is the fallback.
          avm install ${ANCHOR_VERSION} || avm install ${ANCHOR_VERSION} --from-source
          avm use ${ANCHOR_VERSION}
      - run: anchor build
      - run: ./scripts/sync_idl.sh --check
      - name: deployed Token-2022 + ATA (LiteSVM's bundled Token-2022 lacks zk-ops)
        run: ./scripts/fetch_external_programs.sh
      - name: program size budget (devnet rent is paid once, forever)
        run: make size
      - name: overflow-checks must stay on in release
        run: grep -q '^overflow-checks = true' Cargo.toml
      - run: cargo test --workspace
      - run: cargo test -p window-tests --test measurements -- --nocapture

  ts:
    name: typecheck + lint + unit tests (sdk, services, app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1", targets: "wasm32-unknown-unknown" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build_wasm.sh
      - run: pnpm --filter @thewindow/solana-sdk build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @thewindow/app build
      - run: node scripts/measurements_to_md.mjs --check

  integration:
    name: real validator (tier 2)
    runs-on: ubuntu-latest
    needs: [programs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1" }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: install solana + anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          # avm verifies the prebuilt binary's build provenance against GitHub's attestation API, which
          # answered 403 on 23 Sep (unauthenticated rate limit) and failed the whole job. GITHUB_TOKEN
          # (set at the top of this file) authenticates that call; a source build is the fallback.
          avm install ${ANCHOR_VERSION} || avm install ${ANCHOR_VERSION} --from-source
          avm use ${ANCHOR_VERSION}
      # The prebuilt x86_64 Linux solana-test-validator (4.2.1, 4.2.2, 4.3.0) refuses pubkey-validity
      # proofs that the macOS build of the same commit, LiteSVM and devnet accept (see RUNBOOK §5 and
      # `window-admin zk-probe`); one built from source on this runner accepts them. Cached by
      # actions/cache, so it compiles once per version.
      - uses: actions/cache@v4
        id: validator-cache
        with:
          path: ~/agave-src
          key: solana-test-validator-src-${{ env.SOLANA_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: build solana-test-validator from source
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libudev-dev libclang-dev pkg-config libssl-dev
          cargo install agave-validator --version ${SOLANA_VERSION} --bin solana-test-validator --locked --root $HOME/agave-src
      - run: echo "$HOME/agave-src/bin" >> $GITHUB_PATH
      - run: cargo install wasm-pack --locked
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build_wasm.sh && pnpm --filter @thewindow/solana-sdk build
      - run: anchor build
      - run: cargo build -p window-admin --release
      # The admin service and the localnet scripts sign with the default CLI keypair.
      - run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
      - run: which solana-test-validator && solana-test-validator --version && WINDOW_PROFILE=integration ./scripts/localnet.sh probe
      - run: make test-integration
      - name: service and validator logs (on failure)
        if: failure()
        run: |
          cargo test -p window-client --release -- proof_self_check || true
          for f in admin.log agents.log test-ledger.log; do echo "== $f"; tail -n 60 "$f" 2>/dev/null || true; done
          tail -n 40 test-ledger/validator.log 2>/dev/null || true

  docs:
    name: honest claims + lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_claims.sh
      - run: ./scripts/check_lineage.sh
