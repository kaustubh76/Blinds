name: pages

# Builds the dashboard and publishes it to GitHub Pages on every push to main. No Rust toolchain:
# the browser proof engine (sdk/wasm) is committed, so this is pnpm + Vite only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter @thewindow/solana-sdk build
      - run: pnpm --filter @thewindow/app build
        env:
          VITE_BASE: /Blinds/
          VITE_CLUSTER: devnet
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL || 'https://api.devnet.solana.com' }}
          # Browser-friendly mainnet RPC for the Pyth underlying-equity read (api.mainnet-beta answers 403 to browsers).
          VITE_MAINNET_RPC_URL: ${{ vars.VITE_MAINNET_RPC_URL || 'https://solana-rpc.publicnode.com' }}
      # The faucet pointer the hosted app reads at runtime (see deployments/admin-url.txt).
      - run: cp deployments/admin-url.txt app/dist/admin-url.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # What a visitor actually gets, checked after it is live. The browser drivers are the only thing
  # that would have caught a card rendering nothing or a route throwing, and until now they ran in no
  # workflow at all. This one is advisory: it reads a deployed site over the public internet and a
  # rate-limited RPC, so a red here means "go look", not "the commit is bad" — the blocking checks
  # live in ci.yml, which never touches a network it does not control.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod=false
      - run: npx --yes @puppeteer/browsers install chrome@stable
      - name: every route renders, with no page error and nothing 4xx/5xx
        working-directory: scripts/smoke
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/chrome
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(find "$GITHUB_WORKSPACE" -name chrome -type f -path '*chrome-linux64*' | head -1)"
          node routes.mjs "${{ needs.deploy.outputs.page_url || 'https://kaustubh76.github.io/Blinds/' }}" \
            | tee /dev/stderr \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); bad={k:v for k,v in d.items() if v["pageErrors"] or v["http4xx5xx"]}; sys.exit(f"routes with problems: {bad}" if bad else 0)'

