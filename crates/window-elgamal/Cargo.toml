[package]
name = "window-elgamal"
version = "0.1.0"
description = "Twisted-ElGamal types, homomorphic accumulation and BSGS decryption for THE WINDOW — one implementation for SBF, host and wasm"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
# `std` adds key derivation, encryption, decryption and BSGS (solana-zk-sdk + dalek). The core —
# point arithmetic, ciphertext layouts, accumulation, residuals, the solvency delta — is std-free
# and is what the on-chain programs compile.
std = ["dep:solana-zk-sdk", "dep:curve25519-dalek", "dep:rand", "dep:sha2"]
rayon = ["std", "dep:rayon"]

[dependencies]
bytemuck.workspace = true
solana-curve25519.workspace = true
solana-zk-sdk = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rayon = { version = "1.10", optional = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest.workspace = true
solana-zk-sdk = { workspace = true }
